name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Si Pages está configurado como «Deploy from a branch», GitHub publica además el
  # código sin compilar en cada push. Este disparador vuelve a desplegar la versión
  # compilada justo después, para que siempre sea la última en publicarse.
  workflow_run:
    workflows: [pages-build-deployment]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Tests (rōmaji, repaso espaciado e integridad del contenido)
        run: npm test
      - name: Comprobación de tipos
        run: npm run typecheck
      - name: Construir
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
